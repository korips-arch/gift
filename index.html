<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>С днём рождения!</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3ECFF; --ink:#2A1B4D; --soft:#5B4A80; --pink:#FF4D8D; --yellow:#FFC83D; --card:rgba(255,255,255,.9);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#1E1633;--ink:#FFF4FA;--soft:#C9BCE8;--card:rgba(43,33,71,.9);}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;overflow-x:hidden}
main{position:relative;z-index:1;width:100%;max-width:460px;min-height:100%;padding:24px;text-align:center;display:flex;flex-direction:column;justify-content:center}
body.open main{justify-content:flex-end;padding-bottom:20px}
h1{font-family:Unbounded,"Arial Black",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,8vw,40px);line-height:1.15;margin:0 0 20px;overflow-wrap:anywhere}
p{font-size:16px;line-height:1.5;color:var(--soft);margin:0 0 12px}
.btn{align-self:center;font-family:Unbounded,system-ui,sans-serif;font-weight:600;font-size:17px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:16px 32px;cursor:pointer;box-shadow:0 6px 0 #C2336A;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #C2336A}
.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.gift{width:170px;height:170px;margin:0 auto 24px;display:block;animation:wiggle 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes wiggle{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-6deg)}84%{transform:rotate(6deg)}92%{transform:rotate(-3deg)}}
.cap{font-family:Unbounded,system-ui,sans-serif;font-weight:600;font-size:clamp(18px,5.5vw,24px);letter-spacing:.02em;color:rgba(255,255,255,.88);position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 20vh);margin:0;padding:0 20px;text-shadow:0 1px 10px rgba(0,0,0,.55);animation:capin .9s ease both}
.cap.again{animation:capin .9s ease both}
@keyframes capin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:26px;padding:24px 20px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--yellow);max-height:62vh;overflow:auto;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.card h1{font-size:clamp(22px,6.5vw,30px);margin:0 0 14px}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.sign{font-family:Unbounded,system-ui,sans-serif;font-weight:600;color:var(--pink);margin-top:16px;font-size:17px}
.line{opacity:0;animation:rise .9s ease forwards;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#bg{position:fixed;inset:0;z-index:0;opacity:0;transition:opacity 1.2s ease;pointer-events:none;background:#1b1230}
body.open #bg{opacity:1}
.slide{position:absolute;inset:0;background-size:cover;background-position:center 30%;opacity:0;transition:opacity 1s ease}
.slide.on{opacity:1}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(20,12,40,.25),rgba(20,12,40,.05) 35%,rgba(20,12,40,.8))}
[hidden]{display:none!important}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){.gift,.card,.cap{animation:none}.line{opacity:1;animation:none}.slide{transition:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="slide" style="background-image:url(1.jpg)"></div>
  <div class="slide" style="background-image:url(2.jpg)"></div>
  <div class="slide" style="background-image:url(3.jpg)"></div>
  <div class="slide" style="background-image:url(4.jpg)"></div>
</div>
<canvas id="c" aria-hidden="true"></canvas>
<main>
  <section id="closed">
    <svg class="gift" viewBox="0 0 170 170" role="img" aria-label="Подарок">
      <rect x="25" y="70" width="120" height="85" rx="8" fill="#18B8A8"/>
      <rect x="15" y="50" width="140" height="30" rx="8" fill="#FF4D8D"/>
      <rect x="77" y="50" width="16" height="105" fill="#FFC83D"/>
      <path d="M85 50C60 15 30 30 50 46c10 8 27 4 35 4zM85 50c25-35 55-20 35-4-10 8-27 4-35 4z" fill="#FFC83D"/>
    </svg>
    <h1 id="closedTitle">Это для тебя</h1>
    <button class="btn" id="open">Открыть</button>
  </section>
  <section id="opened" hidden>
    <div class="cap" id="cap">мы с тобой</div>
    <div class="card">
      <h1 id="title">С днём рождения!</h1>
      <p class="line" style="--d:.6s">Есть люди, рядом с которыми мир становится теплее. Ты одна из них.</p>
      <p class="line" style="--d:1.8s">С тобой обычные дни превращаются в воспоминания, а трудные становятся легче.</p>
      <div class="sign line" style="--d:3s">Спасибо, что ты есть.</div>
    </div>
  </section>
</main>
<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;

  function decodeName(s){
    try{
      s = s.replace(/-/g,'+').replace(/_/g,'/');
      while (s.length % 4) s += '=';
      var bin = atob(s);
      var bytes = Uint8Array.from(bin, function(c){ return c.charCodeAt(0); });
      return new TextDecoder().decode(bytes);
    }catch(e){ return ''; }
  }
  var name = '';
  var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp) name = decodeName(sp);
  if (!name) name = new URLSearchParams(location.search).get('name') || '';
  name = name.trim().slice(0, 40);
  if (name){
    document.getElementById('title').textContent = 'С днём рождения, ' + name + '!';
    document.getElementById('closedTitle').textContent = name + ', это для тебя';
  }

  if (tg){
    try{
      tg.ready(); tg.expand();
      var m = getComputedStyle(document.body).backgroundColor.match(/\d+/g);
      var hex = '#' + m.slice(0,3).map(function(n){ return ('0'+(+n).toString(16)).slice(-2); }).join('');
      tg.setHeaderColor(hex); tg.setBackgroundColor(hex);
    }catch(e){}
  }

  // Слайд-шоу на фоне
  var slides = document.querySelectorAll('.slide'), cap = document.getElementById('cap'), cur = 0;
  function show(i){
    slides.forEach(function(s,k){ s.classList.toggle('on', k===i); });
    cap.classList.remove('again'); void cap.offsetWidth; cap.classList.add('again');
  }
  function startShow(){
    slides[0].classList.add('on');
    setInterval(function(){ cur = (cur+1) % slides.length; show(cur); }, 3000);
  }

  // Конфетти
  var cv = document.getElementById('c'), ctx = cv.getContext('2d'), parts = [], run = false;
  var cols = ['#FF4D8D','#FFC83D','#18B8A8','#7C5CFF','#FF8A3D'];
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
  size(); addEventListener('resize', size);
  function burst(){
    var d = devicePixelRatio;
    for (var i=0;i<170;i++){
      var a = Math.random()*Math.PI*2, s = (6+Math.random()*12)*d;
      parts.push({x:cv.width/2,y:cv.height*0.55,vx:Math.cos(a)*s,vy:Math.sin(a)*s-8*d,
        w:(6+Math.random()*7)*d,h:(4+Math.random()*5)*d,r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:cols[i%cols.length],life:160+Math.random()*80});
    }
    if (!run){ run = true; requestAnimationFrame(tick); }
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    var d = devicePixelRatio;
    parts = parts.filter(function(p){ return p.life>0 && p.y<cv.height+40; });
    parts.forEach(function(p){
      p.vy += .35*d; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if (parts.length) requestAnimationFrame(tick); else run = false;
  }

  document.getElementById('open').addEventListener('click', function(){
    document.getElementById('closed').hidden = true;
    document.getElementById('opened').hidden = false;
    document.body.classList.add('open');
    startShow();
    try{ tg && tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches){ burst(); setTimeout(burst, 500); }
  });
})();
</script>
</body>
</html>
